{% extends "base.html" %}
{% block title %}{{ profile_user.username }}{% endblock %}
{% block content %}
<div class="card">
  <h2>{{ profile_user.username }}</h2>
  <p>{{ profile_user.bio or "소개글이 없습니다." }}</p>
  {% if current_user.is_authenticated and current_user.id != profile_user.id %}
    <a href="{{ url_for('chat.direct_message', user_id=profile_user.id) }}"><button>1:1 채팅</button></a>
    <a href="{{ url_for('reports.report_user', user_id=profile_user.id) }}"><button class="danger">신고하기</button></a>
  {% endif %}
</div>
{% endblock %}
