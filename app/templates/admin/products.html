{% extends "base.html" %}
{% block title %}상품 관리{% endblock %}
{% block content %}
<h2>상품 관리</h2>
<table>
  <tr><th>ID</th><th>상품명</th><th>판매자</th><th>상태</th><th>신고수</th><th>관리</th></tr>
  {% for p in products %}
  <tr>
    <td>{{ p.id }}</td>
    <td><a href="{{ url_for('products.detail', product_id=p.id) }}">{{ p.title }}</a></td>
    <td>{{ p.seller.username }}</td>
    <td><span class="badge badge-{{ p.status.value }}">{{ p.status.value }}</span></td>
    <td>{{ p.report_count }}</td>
    <td>
      <form method="POST" action="{{ url_for('admin.set_product_status', product_id=p.id, new_status='active') }}" style="display:inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">활성화</button>
      </form>
      <form method="POST" action="{{ url_for('admin.set_product_status', product_id=p.id, new_status='blocked') }}" style="display:inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit" class="danger">차단</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
