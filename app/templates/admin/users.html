{% extends "base.html" %}
{% block title %}회원 관리{% endblock %}
{% block content %}
<h2>회원 관리</h2>
<table>
  <tr><th>ID</th><th>아이디</th><th>상태</th><th>신고수</th><th>관리</th></tr>
  {% for u in users %}
  <tr>
    <td>{{ u.id }}</td>
    <td>{{ u.username }}</td>
    <td><span class="badge badge-{{ u.status.value }}">{{ u.status.value }}</span></td>
    <td>{{ u.report_count }}</td>
    <td>
      {% if u.id != current_user.id %}
      <form method="POST" action="{{ url_for('admin.set_user_status', user_id=u.id, new_status='active') }}" style="display:inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">활성화</button>
      </form>
      <form method="POST" action="{{ url_for('admin.set_user_status', user_id=u.id, new_status='banned') }}" style="display:inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit" class="danger">정지</button>
      </form>
      {% endif %}
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
