{% extends "base.html" %}
{% block title %}메시지함{% endblock %}
{% block content %}
<h2>1:1 메시지함</h2>
{% if conversations %}
  <div class="chat-log">
    {% for c in conversations %}
      <div class="chat-msg">
        <a href="{{ url_for('chat.direct_message', user_id=c.other.id) }}">
          <span class="who">{{ c.other.username }}</span>
        </a>
        <span>{{ c.last_message.body }}</span>
      </div>
    {% endfor %}
  </div>
{% else %}
  <p>아직 주고받은 1:1 메시지가 없습니다.</p>
{% endif %}
{% endblock %}
